name: Release

on:
  workflow_dispatch:

jobs:
  release:
    name: Release
    if: github.ref == 'refs/heads/main' && vars.FOLDER_REVIEW_E2E_VERIFIED == 'true'
    permissions:
      contents: write
      pull-requests: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify before release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:check :patches:buildAndroid --no-daemon

      - name: Release
        uses: cycjimmy/semantic-release-action@v6
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'Chessable Patches ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: patches/build/libs/patches-*.mpp

      - name: Propose generated release metadata
        if: steps.release.outputs.new_release_published == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/release-metadata
          commit-message: 'chore: update generated release metadata'
          title: 'chore: update generated release metadata'
          body: 'Generated by semantic-release. Merge this PR to update Morphe source discovery.'
          add-paths: |
            CHANGELOG.md
            gradle.properties
            patches-bundle.json
            patches-list.json
            README.md
